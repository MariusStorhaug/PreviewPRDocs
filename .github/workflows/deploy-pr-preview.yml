name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: pages-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App token
        id: app-token
        if: ${{ secrets.PREVIEW_APP_ID != '' && secrets.PREVIEW_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}

      - name: Build site
        if: github.event.action != 'closed'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item -Path "site/*" -Destination _site -Recurse -Force
          # Replace with Zensical, for example:
          # zensical build --output _site

      - name: Publish or remove preview
        shell: pwsh
        run: |
          ./scripts/publish-pr-preview.ps1 -BuildDir _site -PrNumber "${{ github.event.number }}" -PrAction "${{ github.event.action }}"

      - name: Sync preview environment
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PREVIEW_ENV_ADMIN_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          ./scripts/sync-pr-preview-environment.ps1 -PrNumber "${{ github.event.number }}" -PrAction "${{ github.event.action }}"

      - name: Comment preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const marker = '<!-- pr-preview-url -->';
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/previews/pr-${context.issue.number}/`;
            const body = `${marker}\nPreview URL: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Comment preview removed
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const marker = '<!-- pr-preview-removed -->';
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/previews/pr-${context.issue.number}/`;
            const body = `${marker}\nPreview removed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
