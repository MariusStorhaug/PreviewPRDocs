name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  deployments: write
  pull-requests: write

concurrency:
  group: pages-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: pr-preview-${{ github.event.number }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.number }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item -Path "site/*" -Destination _site -Recurse -Force
          # Replace with Zensical, for example:
          # zensical build --output _site

      - name: Publish or remove preview
        shell: pwsh
        run: |
          ./scripts/publish-pr-preview.ps1 -BuildDir _site -PrNumber "${{ github.event.number }}" -PrAction "${{ github.event.action }}"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-url -->';
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/previews/pr-${context.issue.number}/`;
            const body = `${marker}\nPreview URL: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  preview-cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove preview
        shell: pwsh
        run: |
          ./scripts/publish-pr-preview.ps1 -BuildDir _site -PrNumber "${{ github.event.number }}" -PrAction "closed"

      - name: Delete preview environment
        uses: actions/github-script@v7
        with:
          script: |
            const environmentName = `pr-preview-${context.issue.number}`;
            try {
              await github.request("DELETE /repos/{owner}/{repo}/environments/{environment_name}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: environmentName
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Environment '${environmentName}' was already deleted.`);
              } else {
                throw error;
              }
            }

      - name: Comment preview removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-removed -->';
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/previews/pr-${context.issue.number}/`;
            const body = `${marker}\nPreview removed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
