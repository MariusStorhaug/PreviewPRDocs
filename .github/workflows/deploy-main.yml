name: Deploy live site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item -Path "site/*" -Destination _site -Recurse -Force
          # Replace with Zensical, for example:
          # zensical build --output _site

      - name: Publish live content to gh-pages root
        shell: pwsh
        run: ./scripts/publish-main.ps1 -BuildDir _site
