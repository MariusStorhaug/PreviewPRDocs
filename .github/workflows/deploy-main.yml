name: Deploy live site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          # Replace with Zensical, for example:
          # zensical build --output _site

      - name: Publish live content to gh-pages root
        run: bash scripts/publish-main.sh _site
